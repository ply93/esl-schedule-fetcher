name: ESL Carrier Charge Auto Fetcher

on:
  # 設定定時觸發：例如每週一到週五的早上 8 點 (UTC 時間 00:00) 自動執行
  schedule:
    - cron: '0 0 * * 1-5'
  # 允許你在 GitHub 網頁上手動點擊按鈕立馬執行
  workflow_dispatch:

jobs:
  scrape_and_save:
    runs-on: ubuntu-latest

    steps:
    # 1. 將 GitHub 倉庫的程式碼複製到雲端虛擬機中
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 設定 Python 環境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.10'

    # 3. 安裝 Python 套件依賴
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. 安裝 Playwright 專用的無頭瀏覽器環境
    - name: Install Playwright Browsers
      run: |
        playwright install chromium --with-deps

    # 5. 執行爬蟲
    - name: Run Scraper
      run: |
        python scraper.py

    # 6. 自動把針對這條航線的新資料提交回 GitHub 倉庫
    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add hkhkg_to_segot_charges.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Charges: HKHKG to SEGOT" && git push)
