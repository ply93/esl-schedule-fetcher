name: ESL 航線收費每日更新

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run ESL charges scraper
        run: python scrape_esl_charges.py

      - uses: actions/upload-artifact@v4
        with:
          name: esl-charges-xlsx
          path: output/esl_charges_*.xlsx
          retention-days: 30

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p output
          git add output/esl_charges_*.xlsx || true
          git diff --staged --quiet || git commit -m "chore: update ESL route charges $(date -u +%Y-%m-%d)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
